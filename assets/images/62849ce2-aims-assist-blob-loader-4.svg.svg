<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="240" height="240" role="img" aria-label="Aims Assist loading indicator">
  <title>Aims Assist animated loader</title>
  <desc>A teal-rimmed circular orb with a soft mesh-gradient background and vivid morphing teal blobs on elliptical orbits, looping every 6 seconds.</desc>

  <defs>
    <clipPath id="frame">
      <circle cx="100" cy="100" r="95"/>
    </clipPath>

    <!-- Mesh-gradient background tint zones -->
    <radialGradient id="tintCool" cx="55" cy="55" r="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C8E8F2" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C8E8F2" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="tintWarm" cx="150" cy="75" r="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE8C8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFE8C8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="tintLow" cx="95" cy="160" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DDF0F5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#DDF0F5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="highlight" cx="0.38" cy="0.28" r="0.42">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blobBright" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#5DD4F0" stop-opacity="1"/>
      <stop offset="55%" stop-color="#1AA3C7" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#047C9E" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blobDeep" cx="0.45" cy="0.45" r="0.7">
      <stop offset="0%" stop-color="#047C9E" stop-opacity="1"/>
      <stop offset="55%" stop-color="#035F7A" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#024152" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blobMid" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#27B5D7" stop-opacity="1"/>
      <stop offset="55%" stop-color="#047C9E" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#047C9E" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blobOrange" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#FFB870" stop-opacity="1"/>
      <stop offset="50%" stop-color="#F38832" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#F38832" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base white circle with teal stroke -->
  <circle cx="100" cy="100" r="97" fill="#FFFFFF" stroke="#047C9E" stroke-width="4"/>

  <g clip-path="url(#frame)">

    <!-- Mesh-gradient tint layers -->
    <rect width="200" height="200" fill="url(#tintCool)"/>
    <rect width="200" height="200" fill="url(#tintWarm)"/>
    <rect width="200" height="200" fill="url(#tintLow)"/>

    <g>

      <!-- Blob A: large bright cyan-teal, wide horizontal orbit, clockwise -->
      <circle cx="88" cy="98" r="46" fill="url(#blobBright)">
        <animateMotion
          path="M 24,0 A 24,16 0 1,1 -24,0 A 24,16 0 1,1 24,0 Z"
          dur="6s" repeatCount="indefinite"/>
        <animate attributeName="r"
          values="46;58;40;54;48;46"
          keyTimes="0;0.2;0.4;0.6;0.8;1"
          calcMode="spline"
          keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"
          dur="6s" repeatCount="indefinite"/>
      </circle>

      <!-- Blob B: large deep teal, tall vertical orbit, counter-clockwise -->
      <circle cx="115" cy="108" r="42" fill="url(#blobDeep)">
        <animateMotion
          path="M 18,0 A 18,28 0 1,0 -18,0 A 18,28 0 1,0 18,0 Z"
          dur="6s" begin="-2s" repeatCount="indefinite"/>
        <animate attributeName="r"
          values="42;36;50;38;44;42"
          keyTimes="0;0.2;0.4;0.6;0.8;1"
          calcMode="spline"
          keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"
          dur="6s" begin="-2s" repeatCount="indefinite"/>
      </circle>

      <!-- Blob C: mid teal, medium horizontal orbit, clockwise -->
      <circle cx="100" cy="85" r="30" fill="url(#blobMid)">
        <animateMotion
          path="M 26,0 A 26,18 0 1,1 -26,0 A 26,18 0 1,1 26,0 Z"
          dur="6s" begin="-1s" repeatCount="indefinite"/>
        <animate attributeName="r"
          values="30;38;28;34;32;30"
          keyTimes="0;0.2;0.4;0.6;0.8;1"
          calcMode="spline"
          keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"
          dur="6s" begin="-1s" repeatCount="indefinite"/>
      </circle>

      <!-- Blob D: vivid orange spark, small balanced orbit, counter-clockwise -->
      <circle cx="125" cy="90" r="15" fill="url(#blobOrange)" opacity="0.92">
        <animateMotion
          path="M 20,0 A 20,16 0 1,0 -20,0 A 20,16 0 1,0 20,0 Z"
          dur="6s" begin="-3.5s" repeatCount="indefinite"/>
        <animate attributeName="r"
          values="15;22;13;19;16;15"
          keyTimes="0;0.2;0.4;0.6;0.8;1"
          calcMode="spline"
          keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"
          dur="6s" begin="-3.5s" repeatCount="indefinite"/>
      </circle>

    </g>

    <ellipse cx="78" cy="58" rx="46" ry="24" fill="url(#highlight)"/>

  </g>
</svg>
